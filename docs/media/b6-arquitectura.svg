<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1140" width="1280" height="1140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <marker id="a-https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="a-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="a-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="a-int" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <rect width="1280" height="1140" fill="#ffffff"/>

  <!-- ================= GitHub (la nube) ================= -->
  <rect x="20" y="20" width="980" height="260" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="40" y="46" font-size="16" font-weight="700">GitHub (la nube)</text>

  <rect x="40" y="90" width="210" height="90" rx="8" fill="#fff" stroke="#57606a"/>
  <text x="145" y="115" text-anchor="middle" font-weight="700">Repositorio</text>
  <text x="145" y="135" text-anchor="middle">hsanchezm7/tasky</text>
  <text x="145" y="155" text-anchor="middle">tag vX.Y.Z</text>

  <rect x="270" y="70" width="470" height="195" rx="8" fill="#fff" stroke="#8250df" stroke-dasharray="6 4"/>
  <text x="285" y="92" font-weight="700" fill="#8250df">GitHub Actions · workflow Release</text>

  <rect x="285" y="105" width="200" height="75" rx="6" fill="#fbefff" stroke="#8250df"/>
  <text x="385" y="128" text-anchor="middle" font-weight="700">job publish</text>
  <text x="385" y="146" text-anchor="middle" font-size="12">runner alojado por GitHub</text>
  <text x="385" y="164" text-anchor="middle" font-size="12">(ubuntu-latest)</text>

  <rect x="505" y="105" width="220" height="75" rx="6" fill="#fbefff" stroke="#8250df"/>
  <text x="615" y="128" text-anchor="middle" font-weight="700">job deploy</text>
  <text x="615" y="146" text-anchor="middle" font-size="12">needs: publish · solo tags v*</text>
  <text x="615" y="164" text-anchor="middle" font-size="12">runs-on: self-hosted</text>

  <rect x="505" y="192" width="220" height="62" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  <text x="615" y="212" text-anchor="middle" font-weight="700">Entorno produccion</text>
  <text x="615" y="229" text-anchor="middle" font-size="12">aprobación manual (reviewer)</text>
  <text x="615" y="246" text-anchor="middle" font-size="12">secret VAULT_PASS</text>

  <rect x="760" y="80" width="220" height="90" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/>
  <text x="870" y="105" text-anchor="middle" font-weight="700">GHCR (registro)</text>
  <text x="870" y="125" text-anchor="middle" font-size="12">ghcr.io/hsanchezm7/tasky</text>
  <text x="870" y="145" text-anchor="middle" font-size="12">:X.Y.Z · :X.Y · :X · sha-…</text>

  <!-- Docker Hub, fuera de GitHub -->
  <rect x="1030" y="40" width="230" height="90" rx="8" fill="#fff" stroke="#0969da" stroke-dasharray="6 4"/>
  <text x="1145" y="65" text-anchor="middle" font-weight="700">Docker Hub (Internet)</text>
  <text x="1145" y="85" text-anchor="middle" font-size="12">imagen postgres:16</text>
  <text x="1145" y="105" text-anchor="middle" font-size="12">fuera de GitHub</text>

  <!-- ② el tag dispara el workflow -->
  <path d="M250,135 L285,142" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
  <text x="256" y="128" font-weight="700" fill="#57606a">②</text>
  <!-- needs: publish -->
  <path d="M485,142 L505,142" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a-int)"/>

  <!-- ③ publish sube la imagen a GHCR -->
  <path d="M385,105 V58 H870 V80" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="395" y="52" font-size="12" fill="#0969da"><tspan font-weight="700">③</tspan> build + push de la imagen X.Y.Z · HTTPS (la inicia el job publish)</text>

  <!-- ================= Windows 11 (anfitrión físico) ================= -->
  <rect x="20" y="360" width="1240" height="720" rx="12" fill="#fffaf3" stroke="#c2410c" stroke-width="2"/>
  <text x="40" y="386" font-size="16" font-weight="700" fill="#c2410c">Windows 11 (anfitrión físico)</text>

  <rect x="40" y="410" width="200" height="110" rx="8" fill="#fff" stroke="#c2410c"/>
  <text x="140" y="435" text-anchor="middle" font-weight="700">Tú (desarrollador)</text>
  <text x="140" y="455" text-anchor="middle" font-size="12">Git Bash: git push del tag</text>
  <text x="140" y="473" text-anchor="middle" font-size="12">navegador: aprobar deploy</text>
  <text x="140" y="491" text-anchor="middle" font-size="12">terminal: curl</text>

  <rect x="290" y="400" width="450" height="170" rx="8" fill="#eef6ff" stroke="#0969da"/>
  <text x="305" y="422" font-weight="700" fill="#0969da">WSL2 · Ubuntu 22.04</text>

  <rect x="305" y="435" width="195" height="100" rx="6" fill="#fff" stroke="#0969da"/>
  <text x="402" y="458" text-anchor="middle" font-weight="700">Runner autoalojado</text>
  <text x="402" y="477" text-anchor="middle" font-size="12">~/actions-runner · run.sh</text>
  <text x="402" y="495" text-anchor="middle" font-size="12">etiquetas: self-hosted,</text>
  <text x="402" y="512" text-anchor="middle" font-size="12">Linux, X64</text>

  <rect x="525" y="435" width="200" height="100" rx="6" fill="#fff" stroke="#0969da"/>
  <text x="625" y="458" text-anchor="middle" font-weight="700">Ansible (controlador)</text>
  <text x="625" y="477" text-anchor="middle" font-size="12">ansible-core 2.16 + sshpass</text>
  <text x="625" y="495" text-anchor="middle" font-size="12">inventory.ini · deploy.yml</text>
  <text x="625" y="512" text-anchor="middle" font-size="12">vault.yml (cifrado)</text>

  <text x="305" y="558" font-size="11" fill="#57606a">docker CLI → Docker Desktop</text>

  <!-- ⑥ el runner lanza ansible-playbook -->
  <path d="M500,485 L525,485" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a-int)"/>
  <text x="504" y="476" font-weight="700" fill="#57606a">⑥</text>

  <!-- ① git push del tag -->
  <path d="M100,410 V180" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="108" y="322" font-size="12" fill="#0969da"><tspan font-weight="700">①</tspan> git push vX.Y.Z</text>
  <text x="108" y="338" font-size="12" fill="#0969da">HTTPS · inicias tú</text>

  <!-- ④ aprobación del despliegue -->
  <path d="M230,410 V300 H540 V254" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="250" y="294" font-size="12" fill="#0969da"><tspan font-weight="700">④</tspan> aprobar el despliegue · HTTPS (inicias tú, navegador)</text>

  <!-- ⑤ el runner pide trabajo a GitHub -->
  <path d="M450,435 V330 H690 V254" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="698" y="298" font-size="12" fill="#0969da"><tspan font-weight="700">⑤</tspan> long-poll HTTPS</text>
  <text x="698" y="313" font-size="12" fill="#0969da">(lo inicia el runner)</text>
  <text x="698" y="328" font-size="12" fill="#0969da">job + VAULT_PASS + checkout</text>

  <!-- ================= Docker Desktop y la flota ================= -->
  <rect x="40" y="600" width="1200" height="460" rx="10" fill="#eefbf3" stroke="#1a7f37" stroke-width="2"/>
  <text x="1225" y="1050" text-anchor="end" font-weight="700" fill="#1a7f37">Docker Desktop (VM Linux en WSL2) · ejecuta la flota en una red de Compose</text>

  <!-- app1 -->
  <rect x="60" y="650" width="370" height="360" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
  <text x="75" y="672"><tspan font-weight="700">app1</tspan> · contenedor ubuntu-sshd:18.04 (privileged)</text>
  <text x="75" y="692" font-size="12" fill="#bc4c00">localhost:2223 → 22 · localhost:8081 → 8080</text>
  <rect x="80" y="708" width="150" height="44" rx="6" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="155" y="735" text-anchor="middle">sshd · :22</text>
  <text x="245" y="726" font-size="11" fill="#57606a">aquí ejecuta Ansible sus</text>
  <text x="245" y="740" font-size="11" fill="#57606a">módulos (Python 3)</text>
  <rect x="80" y="768" width="330" height="222" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-dasharray="5 3"/>
  <text x="95" y="788" font-size="12" font-weight="700" fill="#1a7f37">dockerd (Docker-in-Docker)</text>
  <rect x="100" y="802" width="290" height="120" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="245" y="826" text-anchor="middle" font-weight="700">contenedor tasky-api</text>
  <text x="245" y="846" text-anchor="middle" font-size="12">ghcr.io/hsanchezm7/tasky:X.Y.Z</text>
  <text x="245" y="866" text-anchor="middle" font-size="12">network_mode: host · escucha :8080</text>
  <text x="245" y="888" text-anchor="middle" font-size="12" fill="#1a7f37"><tspan font-weight="700">⑪</tspan> smoke test GET :8080/actuator/health</text>
  <text x="245" y="908" text-anchor="middle" font-size="11" fill="#57606a">DB_URL=jdbc:postgresql://db1:5432/…</text>
  <text x="255" y="958" font-size="11" fill="#57606a">docker login ghcr.io</text>
  <text x="255" y="974" font-size="11" fill="#57606a">imágenes: tasky:X.Y.Z…</text>

  <!-- app2 -->
  <rect x="450" y="650" width="370" height="360" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
  <text x="465" y="672"><tspan font-weight="700">app2</tspan> · contenedor ubuntu-sshd:18.04 (privileged)</text>
  <text x="465" y="692" font-size="12" fill="#bc4c00">localhost:2224 → 22 · localhost:8082 → 8080</text>
  <rect x="470" y="708" width="150" height="44" rx="6" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="545" y="735" text-anchor="middle">sshd · :22</text>
  <text x="635" y="726" font-size="11" fill="#57606a">aquí ejecuta Ansible sus</text>
  <text x="635" y="740" font-size="11" fill="#57606a">módulos (Python 3)</text>
  <rect x="470" y="768" width="330" height="222" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-dasharray="5 3"/>
  <text x="485" y="788" font-size="12" font-weight="700" fill="#1a7f37">dockerd (Docker-in-Docker)</text>
  <rect x="490" y="802" width="290" height="120" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="635" y="826" text-anchor="middle" font-weight="700">contenedor tasky-api</text>
  <text x="635" y="846" text-anchor="middle" font-size="12">ghcr.io/hsanchezm7/tasky:X.Y.Z</text>
  <text x="635" y="866" text-anchor="middle" font-size="12">network_mode: host · escucha :8080</text>
  <text x="635" y="888" text-anchor="middle" font-size="12" fill="#1a7f37"><tspan font-weight="700">⑪</tspan> smoke test GET :8080/actuator/health</text>
  <text x="635" y="908" text-anchor="middle" font-size="11" fill="#57606a">DB_URL=jdbc:postgresql://db1:5432/…</text>
  <text x="645" y="958" font-size="11" fill="#57606a">docker login ghcr.io</text>
  <text x="645" y="974" font-size="11" fill="#57606a">imágenes: tasky:X.Y.Z…</text>

  <!-- db1 -->
  <rect x="840" y="650" width="380" height="360" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/>
  <text x="855" y="672"><tspan font-weight="700">db1</tspan> · contenedor ubuntu-sshd:18.04 (privileged)</text>
  <text x="855" y="692" font-size="12" fill="#bc4c00">localhost:2225 → 22 · el 5432 no se publica</text>
  <rect x="860" y="708" width="150" height="44" rx="6" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="935" y="735" text-anchor="middle">sshd · :22</text>
  <rect x="860" y="768" width="340" height="222" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-dasharray="5 3"/>
  <text x="875" y="788" font-size="12" font-weight="700" fill="#1a7f37">dockerd (Docker-in-Docker)</text>
  <rect x="880" y="802" width="300" height="120" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="1030" y="826" text-anchor="middle" font-weight="700">contenedor tasky-db</text>
  <text x="1030" y="846" text-anchor="middle" font-size="12">postgres:16 · network_mode: host</text>
  <text x="1030" y="866" text-anchor="middle" font-size="12">escucha :5432</text>
  <text x="1030" y="886" text-anchor="middle" font-size="12">volumen tasky-db-data</text>
  <text x="1030" y="906" text-anchor="middle" font-size="11" fill="#57606a">healthcheck pg_isready</text>

  <!-- ⑦ SSH de Ansible a cada máquina -->
  <path d="M560,535 V625 H245 V650" stroke="#bc4c00" stroke-width="2" fill="none" marker-end="url(#a-ssh)"/>
  <path d="M625,535 V650" stroke="#bc4c00" stroke-width="2" fill="none" marker-end="url(#a-ssh)"/>
  <path d="M690,535 V625 H1030 V650" stroke="#bc4c00" stroke-width="2" fill="none" marker-end="url(#a-ssh)"/>
  <text x="252" y="644" font-size="12" fill="#bc4c00"><tspan font-weight="700">⑦</tspan> SSH :2223</text>
  <text x="632" y="644" font-size="12" fill="#bc4c00"><tspan font-weight="700">⑦</tspan> SSH :2224</text>
  <text x="1037" y="644" font-size="12" fill="#bc4c00"><tspan font-weight="700">⑦</tspan> SSH :2225</text>

  <!-- ⑧ db1 descarga postgres:16 de Docker Hub -->
  <path d="M1150,650 V130" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="1158" y="420" font-size="12" fill="#0969da" font-weight="700">⑧ docker pull</text>
  <text x="1158" y="436" font-size="12" fill="#0969da">postgres:16</text>
  <text x="1158" y="452" font-size="12" fill="#0969da">HTTPS</text>
  <text x="1158" y="468" font-size="12" fill="#0969da">(lo inicia db1)</text>

  <!-- ⑨ app1 y app2 descargan la imagen de GHCR -->
  <path d="M400,650 V580 H900 V170" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <path d="M790,650 V595 H950 V170" stroke="#0969da" stroke-width="2" fill="none" marker-end="url(#a-https)"/>
  <text x="958" y="420" font-size="12" fill="#0969da" font-weight="700">⑨ docker pull</text>
  <text x="958" y="436" font-size="12" fill="#0969da">tasky:X.Y.Z · HTTPS</text>
  <text x="958" y="452" font-size="12" fill="#0969da">(lo inician app1 y app2)</text>

  <!-- ⑩ las API se conectan a PostgreSQL en db1 -->
  <path d="M245,922 V1032 H1060 V922" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#a-local)"/>
  <path d="M635,922 V1020 H1000 V922" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#a-local)"/>
  <text x="60" y="1050" font-size="12" fill="#1a7f37"><tspan font-weight="700">⑩</tspan> PostgreSQL · TCP db1:5432 (lo inicia la API)</text>

  <!-- ⑫ compruebas las dos réplicas -->
  <path d="M80,520 V650" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#a-local)"/>
  <path d="M120,520 V612 H470 V650" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#a-local)"/>
  <text x="128" y="548" font-size="12" fill="#1a7f37"><tspan font-weight="700">⑫</tspan> curl :8081 / :8082</text>
  <text x="128" y="564" font-size="12" fill="#1a7f37">HTTP · inicias tú</text>

  <!-- Leyenda -->
  <g font-size="12">
    <line x1="30" y1="1106" x2="60" y2="1106" stroke="#0969da" stroke-width="2" marker-end="url(#a-https)"/>
    <text x="68" y="1110">HTTPS hacia Internet / GitHub</text>
    <line x1="270" y1="1106" x2="300" y2="1106" stroke="#bc4c00" stroke-width="2" marker-end="url(#a-ssh)"/>
    <text x="308" y="1110">SSH</text>
    <line x1="360" y1="1106" x2="390" y2="1106" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-local)"/>
    <text x="398" y="1110">HTTP / TCP en la red local</text>
    <line x1="590" y1="1106" x2="620" y2="1106" stroke="#57606a" stroke-width="2" marker-end="url(#a-int)"/>
    <text x="628" y="1110">paso interno (sin red)</text>
    <text x="800" y="1110" fill="#57606a">Cada flecha sale de quien inicia la conexión.</text>
  </g>
</svg>
