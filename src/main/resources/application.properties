# Nombre de la aplicacion
spring.application.name=tasky

# --- Base de datos PostgreSQL ---
# Valores por defecto pensados para el docker-compose.yml del repositorio;
# se pueden sobrescribir con las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasky}
spring.datasource.username=${DB_USERNAME:tasky}
spring.datasource.password=${DB_PASSWORD:tasky}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Configuración de Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
