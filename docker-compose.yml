services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tareas}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_local_dev}
    # Solo para conectarte desde tu máquina con un cliente SQL.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-tareas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Puerto del host configurable: API_PORT=XXXX docker compose up para usar otro.
    ports: ["${API_PORT:-8084}:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5433/${POSTGRES_DB:-tareas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret_local_dev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
