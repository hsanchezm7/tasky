name: Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

# solo una publicación a la vez; no se cancela la que está en curso
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read   # leer el código (checkout)
  pages: write     # publicar en GitHub Pages
  id-token: write  # deploy-pages verifica la identidad del workflow con OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Instalar dependencias
        run: pip install -r docs/requirements.txt
      - name: Generar la web
        run: python docs/build.py
      - name: Subir la web como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
